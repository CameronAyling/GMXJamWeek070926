#:schema ../../.gm-schema/v1.json#font

# Dense labels: cell tags, tooltips, charge readouts.
#
# Chakra Petch Bold, bundled as source.ttf so every machine renders the same
# thing — the whole UI is on this one face now. It is proportional, not the
# monospace this used to be, so readout columns line up by placement rather
# than by character count.
mode = "ttf"
size = 11

# Latin plus the general-punctuation block, so em-dashes and quotes
# actually rasterise instead of coming out blank.
charset_ranges = [{ from = 32, to = 126 }, { from = 0xA0, to = 0xFF }, { from = 0x2010, to = 0x2027 }]
