#:schema ../../.gm-schema/v1.json#font

# Panel headers and faction names. The weight is in the face, so no `bold`.
mode = "ttf"
size = 18

# Latin plus the general-punctuation block, so em-dashes and quotes
# actually rasterise instead of coming out blank.
charset_ranges = [{ from = 32, to = 126 }, { from = 0xA0, to = 0xFF }, { from = 0x2010, to = 0x2027 }]
